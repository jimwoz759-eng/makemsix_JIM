name: build-makemsix
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Upstream CMakeLists use an old cmake_minimum_required; newer CMake needs this.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build makemsix (no tests/samples)
        shell: cmd
        run: |
          call makewin.cmd ${{ matrix.arch }} --skip-tests --skip-samples > build.log 2>&1
          exit /b 0
      - name: Report build log tail
        if: always()
        shell: pwsh
        run: |
          $tail = (Get-Content build.log -Tail 70 -ErrorAction SilentlyContinue | Out-String)
          $esc = $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Host "::error title=build-tail-${{ matrix.arch }}::$esc"
          $bins = (Get-ChildItem -Recurse .vs -Include makemsix.exe,msix.dll -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName + ' ' + $_.Length } | Out-String)
          Write-Host "::warning title=found-bins-${{ matrix.arch }}::$($bins.Replace("`r",'').Replace("`n",'%0A'))"
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse .vs -Include makemsix.exe,msix.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName out\ }
          Get-ChildItem out
      - name: Publish to GitHub Release (tag: latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path out\* -DestinationPath makemsix-win-${{ matrix.arch }}.zip -Force
          $notes = "makemsix.exe + msix.dll built from microsoft/msix-packaging (MIT). Keep both files in the same folder. Needs the VC++ 2015-2022 Redistributable."
          gh release create latest --title "makemsix latest" --notes $notes 2>$null
          gh release upload latest makemsix-win-${{ matrix.arch }}.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: makemsix-win-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
